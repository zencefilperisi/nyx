name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang builds and runs the full suite (SanitizerCoverage targets).
          - { cc: clang, cxx: clang++, name: clang }
          # GCC builds the portable core; the Clang-only coverage targets are
          # skipped automatically (GCC lacks -fsanitize-coverage=trace-pc-guard).
          - { cc: gcc, cxx: g++, name: gcc }
    name: build-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Configure (ASan + UBSan, Clang for C and C++)
        run: >
          cmake -S . -B build-asan -DNYX_ASAN=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-asan -j
      - name: Test under sanitizers
        run: ctest --test-dir build-asan --output-on-failure
